# Optional for the backend: without a worker, hotspots simply stay `pending` and the app works as usual.
# Two workers, one per backend, each with its own settings file (see .env.example):
#   docker compose --profile local up -d --build   # the backend's local stack: its Redis and S3Mock (.env.local)
#   docker compose --profile aws up -d --build     # the deployed app: SQS and the real bucket (.env.aws)
# Both profiles at once share the GPU.
x-worker: &worker
  build: .
  gpus: all
  volumes:
    - model_cache:/models
  # The backend's local Redis and S3Mock are published on the host; this makes the name resolve on Linux too.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  restart: on-failure

services:
  worker-local:
    <<: *worker
    profiles: [ "local" ]
    env_file: .env.local

  worker-aws:
    <<: *worker
    profiles: [ "aws" ]
    env_file: .env.aws

volumes:
  # The model weights, downloaded once for both workers.
  model_cache:
